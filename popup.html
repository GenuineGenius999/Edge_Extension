<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fluent Table Enhancer</title>

<link rel="stylesheet" href="popup.css">

</head>


<body>

<div class="container">


    <div class="header">

        <img 
        src="https://cdn-icons-png.flaticon.com/512/2920/2920277.png"
        class="logo">

        <div>

            <h1>
                Fluent Tables
            </h1>

            <p>
                Modern table styling
            </p>

        </div>

    </div>



    <div class="card">


        <div class="row">

            <span>
                Enable Enhancer
            </span>


            <label class="switch">

                <input 
                type="checkbox" 
                id="enableToggle"
                checked>

                <span class="slider"></span>

            </label>


        </div>


    </div>




    <div class="card">


        <h2>
            Features
        </h2>


        <ul>

            <li>✨ Fluent UI Design</li>

            <li>📌 Sticky Headers</li>

            <li>🔢 Smart Number Formatting</li>

            <li>🌙 Dark Mode Support</li>

            <li>📱 Responsive Tables</li>

            <li>🎨 Status Badges</li>

        </ul>


    </div>





    <button id="settingsBtn">

        ⚙ Settings

    </button>



    <footer>

        Fluent Table Enhancer v1.0

    </footer>


</div>



<script src="popup.js"></script>


</body>

</html>
